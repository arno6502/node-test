name: Docker Build
# Läuft bei Push und Pull Request auf jeden Branch
on:
  push:
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Docker Image bauen
      - name: Build Docker image
        run: |
          set -x
          docker build -t ghcr.io/${{ github.actor }}/node-test:001 .

      # 3️⃣ Docker Image anzeigen
      - name: Show Docker image
        run: docker images ghcr.io/${{ github.actor }}/node-test:001

      # 4️⃣ Login bei GitHub Container Registry (automatisch mit GITHUB_TOKEN)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5️⃣ Image pushen zu GHCR
      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ github.actor }}/node-test:001